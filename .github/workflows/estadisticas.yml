name: Actualizar estadísticas EOH

# Revisa todos los meses si DIPEC publicó datos nuevos de la Encuesta de
# Ocupación Hotelera. Si la planilla cambió, regenera estadisticas.json y lo
# commitea a main: Render detecta el push y publica solo. Si no hay datos
# nuevos, el script deja el archivo igual y el workflow termina sin commit.

on:
  schedule:
    # Día 10 de cada mes a las 12:00 UTC (09:00 en Argentina).
    - cron: "0 12 10 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estadisticas-eoh
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Comprobar permiso de escritura
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git push --dry-run origin HEAD:main; then
            echo "El token puede pushear a main."
          else
            echo "::error::El token de Actions no puede escribir en main. Revisá Settings → Actions → General → Workflow permissions."
            exit 1
          fi

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scripts.txt

      - name: Instalar dependencias del script
        run: pip install -r requirements-scripts.txt

      - name: Regenerar estadisticas.json
        run: python scripts/actualizar_estadisticas.py

      - name: Ver si cambió el archivo
        id: cambios
        run: |
          if git diff --quiet -- estadisticas.json; then
            echo "cambio=false" >> "$GITHUB_OUTPUT"
            echo "Sin datos nuevos: no se commitea nada."
          else
            echo "cambio=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- estadisticas.json
          fi

      - name: Commitear y pushear
        if: steps.cambios.outputs.cambio == 'true'
        run: |
          periodo=$(python -c "import json; print(json.load(open('estadisticas.json'))['periodo'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estadisticas.json
          git commit -m "Actualizar estadísticas de turismo: $periodo" \
                     -m "Datos de la EOH de DIPEC regenerados por scripts/actualizar_estadisticas.py."
          git push origin HEAD:main

      - name: Resumen
        run: |
          {
            echo "### Estadísticas EOH"
            echo
            if [ "${{ steps.cambios.outputs.cambio }}" = "true" ]; then
              echo "Se actualizó \`estadisticas.json\` y se pusheó a \`main\`. Render va a publicar el cambio."
            else
              echo "Sin datos nuevos: no hubo commit."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
